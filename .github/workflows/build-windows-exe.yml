name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build OpenSnap package
        shell: pwsh
        run: .\packaging\build-windows.ps1

      - name: Verify packaged UI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\dist\OpenSnap-windows.zip")
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
            $need = @(
              'OpenSnap/OpenSnap.exe',
              'OpenSnap/_internal/frontend/dist/index.html',
              'OpenSnap/frontend/dist/index.html'
            )
            foreach ($n in $need) {
              if ($names -notcontains $n) { throw "Artifact missing required path: $n" }
            }
            Write-Host "UI paths present in OpenSnap-windows.zip"
          } finally {
            $zip.Dispose()
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSnap-windows
          path: dist/OpenSnap-windows.zip

      # Durable public URL used by the Cloudflare UI (/download/windows):
      # https://github.com/augmentedmd/urosnap/releases/latest/download/OpenSnap-windows.zip
      - name: Publish latest Windows package release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'windows-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('OpenSnap {0}', github.ref_name) || 'OpenSnap Windows (latest)' }}
          files: dist/OpenSnap-windows.zip
          make_latest: true
          body: |
            Windows clinic package (`OpenSnap-windows.zip`).

            1. Download and extract the full `OpenSnap` folder.
            2. Double-click `OpenSnap.exe`.
            3. Work at http://127.0.0.1:8000 — or bookmark the Cloudflare UI and download from `/download/windows`.

            Binary only — not PHI. Cloudflare never receives clinical data.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
